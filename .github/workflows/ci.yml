name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  ios-spm:
    name: iOS · SPM build
    runs-on: macos-14
    defaults: { run: { working-directory: ios } }
    steps:
      - uses: actions/checkout@v4
      - name: Swift build
        run: swift build
      - name: Swift test
        run: swift test || true   # remove `|| true` once Tests/ exists

  ios-cocoapods:
    name: iOS · Pod lint
    runs-on: macos-14
    defaults: { run: { working-directory: ios } }
    steps:
      - uses: actions/checkout@v4
      - name: Pod lib lint
        run: pod lib lint NetworkContracts.podspec --allow-warnings

  ios-parity:
    name: iOS · Manifest parity
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: ios } }
    steps:
      - uses: actions/checkout@v4
      - name: Both manifests point at Sources/NetworkContracts
        run: |
          grep -q 'Sources/NetworkContracts' Package.swift
          grep -q 'Sources/NetworkContracts' NetworkContracts.podspec

  android:
    name: Android · Gradle build
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: android } }
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}

      - name: Gradle build
        run: ./gradlew build --no-daemon
